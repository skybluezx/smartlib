<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">学校知识的来源、形成与更新</title>
  <desc id="desc">图书馆电子资源、学校业务数据和外部数据经过许可识别、治理、对象统一、画像、知识关系组织和智能处理，形成应用服务，并通过人工确认和使用反馈持续更新。</desc>
  <defs>
    <style>
      .title{font:700 34px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#17213D}
      .subtitle{font:400 18px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:#667085}
      .h1{font:700 24px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
      .h2{font:700 20px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
      .body{font:400 17px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
      .small{font:400 15px 'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif}
      .white{fill:#FFFFFF}.navy{fill:#17213D}.muted{fill:#667085}
      .line{fill:none;stroke:#8D96A8;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#8D96A8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#6656D6"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#F7F8FC"/>
  <text x="48" y="52" class="title">学校知识的来源、形成与更新</text>
  <text x="48" y="82" class="subtitle">电子资源提供学术内容和证据，学校数据提供本校身份与业务关系，二者共同形成可持续使用的学校知识</text>

  <!-- Sources -->
  <rect x="48" y="112" width="520" height="142" rx="18" fill="#14766E"/>
  <text x="76" y="151" class="h1 white">图书馆电子资源与自建资源</text>
  <text x="76" y="184" class="body white">数据库 · 电子期刊 · 电子图书 · 学位论文</text>
  <text x="76" y="214" class="body white">专利与标准 · 事实型数据 · 专题资源 · 元数据</text>
  <rect x="76" y="227" width="218" height="8" rx="4" fill="#8ED8CF"/>
  <text x="310" y="239" class="small white">核心学术内容与证据</text>

  <rect x="592" y="112" width="432" height="142" rx="18" fill="#E8F1FF" stroke="#7FA9DC" stroke-width="2"/>
  <text x="620" y="151" class="h1" fill="#245B9A">学校业务数据</text>
  <text x="620" y="184" class="body navy">人员 · 机构 · 项目 · 成果 · 课程</text>
  <text x="620" y="214" class="body navy">学科 · 专业 · 平台 · 设备 · 管理数据</text>
  <text x="620" y="239" class="small" fill="#245B9A">本校身份、权威事实与业务关系</text>

  <rect x="1048" y="112" width="304" height="142" rx="18" fill="#FFF1E2" stroke="#E6A25C" stroke-width="2"/>
  <text x="1076" y="151" class="h1" fill="#A65309">外部学术与公共数据</text>
  <text x="1076" y="184" class="body navy">校外学者与机构</text>
  <text x="1076" y="214" class="body navy">对标数据 · 产业与临床需求</text>
  <text x="1076" y="239" class="small" fill="#A65309">补充外部关系和比较范围</text>

  <path d="M308 254 V287 H1180 V254" class="line"/>
  <path d="M808 254 V287" class="line"/>
  <path d="M700 287 V313" class="line" marker-end="url(#arrow)"/>

  <!-- Knowledge formation stages -->
  <rect x="48" y="330" width="198" height="140" rx="16" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="2"/>
  <circle cx="76" cy="359" r="16" fill="#14766E"/><text x="76" y="365" text-anchor="middle" class="small white">1</text>
  <text x="101" y="366" class="h2 navy">接入与许可识别</text>
  <text x="72" y="405" class="body muted">分类存储</text>
  <text x="72" y="434" class="body muted">记录使用范围</text>

  <rect x="270" y="330" width="198" height="140" rx="16" fill="#FFFFFF" stroke="#B9C0CE" stroke-width="2"/>
  <circle cx="298" cy="359" r="16" fill="#14766E"/><text x="298" y="365" text-anchor="middle" class="small white">2</text>
  <text x="323" y="366" class="h2 navy">清洗与标准统一</text>
  <text x="294" y="405" class="body muted">标准转换</text>
  <text x="294" y="434" class="body muted">质量检查与更新</text>

  <rect x="492" y="330" width="198" height="140" rx="16" fill="#E3F4F1" stroke="#69B8AE" stroke-width="2"/>
  <circle cx="520" cy="359" r="16" fill="#14766E"/><text x="520" y="365" text-anchor="middle" class="small white">3</text>
  <text x="545" y="366" class="h2" fill="#0E5D56">对象识别与统一</text>
  <text x="516" y="405" class="body navy">同名、异名与重复处理</text>
  <text x="516" y="434" class="body navy">统一对象标识</text>

  <rect x="714" y="330" width="198" height="140" rx="16" fill="#EEEAFB" stroke="#9C8BE5" stroke-width="2"/>
  <circle cx="742" cy="359" r="16" fill="#6656D6"/><text x="742" y="365" text-anchor="middle" class="small white">4</text>
  <text x="767" y="366" class="h2" fill="#443991">事实与画像形成</text>
  <text x="738" y="405" class="body navy">对象事实与特征指标</text>
  <text x="738" y="434" class="body navy">分析画像与任务评价</text>

  <rect x="936" y="330" width="198" height="140" rx="16" fill="#E8F1FF" stroke="#7FA9DC" stroke-width="2"/>
  <circle cx="964" cy="359" r="16" fill="#2F6FB9"/><text x="964" y="365" text-anchor="middle" class="small white">5</text>
  <text x="989" y="366" class="h2" fill="#245B9A">关系与证据组织</text>
  <text x="960" y="405" class="body navy">对象关系与时间信息</text>
  <text x="960" y="434" class="body navy">来源、证据与确认状态</text>

  <rect x="1158" y="330" width="194" height="140" rx="16" fill="#FFF1E2" stroke="#E6A25C" stroke-width="2"/>
  <circle cx="1186" cy="359" r="16" fill="#D97717"/><text x="1186" y="365" text-anchor="middle" class="small white">6</text>
  <text x="1211" y="366" class="h2" fill="#A65309">检索与智能处理</text>
  <text x="1182" y="405" class="body navy">检索、分析与 RAG</text>
  <text x="1182" y="434" class="body navy">工具调用与智能体任务</text>

  <path d="M246 400 H262" class="line" marker-end="url(#arrow)"/>
  <path d="M468 400 H484" class="line" marker-end="url(#arrow)"/>
  <path d="M690 400 H706" class="line" marker-end="url(#arrow)"/>
  <path d="M912 400 H928" class="line" marker-end="url(#arrow)"/>
  <path d="M1134 400 H1150" class="line" marker-end="url(#arrow)"/>

  <!-- Use and feedback -->
  <path d="M1255 470 V514" class="line" marker-end="url(#arrow)"/>
  <rect x="48" y="532" width="714" height="118" rx="18" fill="#443991"/>
  <text x="78" y="573" class="h1 white">应用服务与结果使用</text>
  <text x="78" y="610" class="body white">学者星图 · 知源智研 · 学科罗盘 · 成果智桥</text>
  <text x="78" y="637" class="small" fill="#DDD7FF">传统检索、浏览和分析，与智能体连续任务并行提供</text>

  <rect x="786" y="532" width="272" height="118" rx="18" fill="#FFF1E2" stroke="#E6A25C" stroke-width="2"/>
  <text x="814" y="573" class="h1" fill="#A65309">人工确认</text>
  <text x="814" y="608" class="body navy">核实关系与分析结果</text>
  <text x="814" y="636" class="small muted">不直接覆盖权威来源</text>

  <rect x="1082" y="532" width="270" height="118" rx="18" fill="#E9EDF4" stroke="#B9C0CE" stroke-width="2"/>
  <text x="1110" y="573" class="h1 navy">使用反馈</text>
  <text x="1110" y="608" class="body navy">纠错 · 确认 · 使用记录</text>
  <text x="1110" y="636" class="small muted">反映实际需求与使用结果</text>

  <path d="M762 591 H778" class="line" marker-end="url(#arrow)"/>
  <path d="M1058 591 H1074" class="line" marker-end="url(#arrow)"/>

  <path d="M1217 650 V715 H150 V488" fill="none" stroke="#6656D6" stroke-width="4" stroke-dasharray="9 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrowPurple)"/>
  <rect x="496" y="691" width="408" height="52" rx="26" fill="#EEEAFB" stroke="#9C8BE5" stroke-width="2"/>
  <text x="700" y="724" text-anchor="middle" class="h2" fill="#443991">反馈更新对象事实、画像和知识关系</text>

  <text x="48" y="786" class="small muted">全过程保留来源、责任、许可、时间和确认状态</text>
</svg>
