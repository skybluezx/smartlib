name: smartlib

services:
  postgres:
    image: ${SMARTLIB_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_DB: ${SMARTLIB_DB_NAME:-smartlib}
      POSTGRES_USER: ${SMARTLIB_DB_BOOTSTRAP_USER:-smartlib_bootstrap}
      POSTGRES_PASSWORD: ${SMARTLIB_DB_BOOTSTRAP_PASSWORD:?Set SMARTLIB_DB_BOOTSTRAP_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --auth-host=scram-sha-256"
    volumes:
      - smartlib-postgres:/var/lib/postgresql
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    networks:
      - smartlib-internal

  bootstrap-runtime-roles:
    image: ${SMARTLIB_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      PGHOST: postgres
      PGUSER: ${SMARTLIB_DB_BOOTSTRAP_USER:-smartlib_bootstrap}
      PGPASSWORD: ${SMARTLIB_DB_BOOTSTRAP_PASSWORD:?Set SMARTLIB_DB_BOOTSTRAP_PASSWORD}
      PGDATABASE: ${SMARTLIB_DB_NAME:-smartlib}
    command: ["sh", "/provision/bootstrap-runtime-roles.sh"]
    volumes:
      - ../../database/provision:/provision:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - smartlib-internal

  migrate:
    image: ${SMARTLIB_FLYWAY_IMAGE:-flyway/flyway:13.0.0-alpine}
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      FLYWAY_USER: ${SMARTLIB_DB_BOOTSTRAP_USER:-smartlib_bootstrap}
      FLYWAY_PASSWORD: ${SMARTLIB_DB_BOOTSTRAP_PASSWORD:?Set SMARTLIB_DB_BOOTSTRAP_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: 30
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    command: migrate
    volumes:
      - ../../database/migrations:/flyway/sql:ro
    depends_on:
      bootstrap-runtime-roles:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  provision-api-role:
    image: ${SMARTLIB_POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      PGHOST: postgres
      PGUSER: ${SMARTLIB_DB_BOOTSTRAP_USER:-smartlib_bootstrap}
      PGPASSWORD: ${SMARTLIB_DB_BOOTSTRAP_PASSWORD:?Set SMARTLIB_DB_BOOTSTRAP_PASSWORD}
      PGDATABASE: ${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DB_API_PASSWORD: ${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}
      SMARTLIB_DB_PROJECTION_PASSWORD: ${SMARTLIB_DB_PROJECTION_PASSWORD:?Set SMARTLIB_DB_PROJECTION_PASSWORD}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
    command: ["sh", "/provision/provision-api-role.sh"]
    volumes:
      - ../../database/provision:/provision:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  minio:
    build:
      context: ../minio-community
      dockerfile: Dockerfile
      args:
        GO_IMAGE: ${SMARTLIB_GO_IMAGE:-public.ecr.aws/docker/library/golang:1.24.8-alpine}
        RUNTIME_IMAGE: ${SMARTLIB_MINIO_RUNTIME_IMAGE:-public.ecr.aws/docker/library/alpine:3.22}
        MINIO_SOURCE_REF: ${SMARTLIB_MINIO_SOURCE_REF:-7aac2a2c5b7c882e68c1ce017d8256be2feea27f}
        GO_PROXY: ${SMARTLIB_GO_PROXY:-https://proxy.golang.org,direct}
    image: smartlib/minio-community:${SMARTLIB_MINIO_IMAGE_TAG:-7aac2a2}
    environment:
      MINIO_ROOT_USER: ${SMARTLIB_MINIO_ROOT_USER:?Set SMARTLIB_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${SMARTLIB_MINIO_ROOT_PASSWORD:?Set SMARTLIB_MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${SMARTLIB_MINIO_BROWSER_REDIRECT_URL:-http://localhost:19001}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - smartlib-minio:/data
    ports:
      - "${SMARTLIB_MINIO_API_PORT:-19000}:9000"
      - "${SMARTLIB_MINIO_CONSOLE_PORT:-19001}:9001"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12
    networks:
      - smartlib-internal

  minio-init:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    environment:
      SMARTLIB_S3_ENDPOINT_URL: http://minio:9000
      SMARTLIB_S3_ACCESS_KEY: ${SMARTLIB_MINIO_ROOT_USER:?Set SMARTLIB_MINIO_ROOT_USER}
      SMARTLIB_S3_SECRET_KEY: ${SMARTLIB_MINIO_ROOT_PASSWORD:?Set SMARTLIB_MINIO_ROOT_PASSWORD}
      SMARTLIB_S3_REGION: ${SMARTLIB_S3_REGION:-us-east-1}
      SMARTLIB_S3_BUCKET: ${SMARTLIB_S3_BUCKET:-smartlib-publications}
      SMARTLIB_REFERENCE_DATA_BUCKET: ${SMARTLIB_REFERENCE_DATA_BUCKET:-smartlib-reference-data}
    command: ["python", "/smartlib-minio/bootstrap.py"]
    volumes:
      - ../minio-community:/smartlib-minio:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - smartlib-internal

  controlled-scholar-import:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["controlled-import"]
    environment:
      SMARTLIB_DATABASE_URL: postgresql://smartlib_api:${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
    command:
      - python
      - /app/scripts/import_controlled_scholars.py
      - --package
      - /smartlib-imports/2026-nsf-representative-publications-v1/scholars.json
      - --apply
      - --rebuild-affiliations
    volumes:
      - ../../data/imports:/smartlib-imports:ro
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  controlled-discipline-taxonomy-import:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["controlled-import"]
    environment:
      SMARTLIB_DATABASE_URL: postgresql://smartlib_api:${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
      SMARTLIB_S3_ENDPOINT_URL: http://minio:9000
      SMARTLIB_S3_ACCESS_KEY: ${SMARTLIB_MINIO_ROOT_USER:?Set SMARTLIB_MINIO_ROOT_USER}
      SMARTLIB_S3_SECRET_KEY: ${SMARTLIB_MINIO_ROOT_PASSWORD:?Set SMARTLIB_MINIO_ROOT_PASSWORD}
      SMARTLIB_S3_REGION: ${SMARTLIB_S3_REGION:-us-east-1}
      SMARTLIB_REFERENCE_DATA_BUCKET: ${SMARTLIB_REFERENCE_DATA_BUCKET:-smartlib-reference-data}
    command:
