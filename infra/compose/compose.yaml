      - --package
      - /smartlib-imports/discipline-taxonomies-2026-09-04/taxonomies.json
      - --source-root
      - /smartlib-discipline-source
      - --apply
    volumes:
      - ../../apps/platform-api/scripts:/app/scripts:ro
      - ../../data/imports:/smartlib-imports:ro
      - ../../outputs/reference_data_preview/discipline_taxonomies/2026-09-04:/smartlib-discipline-source:ro
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
