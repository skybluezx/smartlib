      - --apply
    volumes:
      - ../../apps/platform-api/scripts:/app/scripts:ro
      - ../../data/archive-fulltext-discovery:/smartlib-archive-results
      - ${SMARTLIB_ARCHIVE_FULLTEXT_SOURCE:-/Volumes/张蕾历年工作备份}:/smartlib-archive:ro
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  controlled-fulltext-author-verification:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["controlled-import"]
    environment:
      SMARTLIB_DATABASE_URL: postgresql://smartlib_api:${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
    command:
      - python
      - /app/scripts/run_fulltext_author_verification.py
      - --matches
      - /smartlib-archive-results/matches.json
      - --reported-root
      - /Volumes/张蕾历年工作备份
      - --archive-root
      - /smartlib-archive
      - --report
      - /smartlib-archive-results/author-verification-report.json
      - --apply
    volumes:
      - ../../apps/platform-api/scripts:/app/scripts:ro
      - ../../data/archive-fulltext-discovery:/smartlib-archive-results
      - ${SMARTLIB_ARCHIVE_FULLTEXT_SOURCE:-/Volumes/张蕾历年工作备份}:/smartlib-archive:ro
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  controlled-archive-fulltext-staging:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["controlled-import"]
    environment:
      SMARTLIB_DATABASE_URL: postgresql://smartlib_api:${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
      SMARTLIB_S3_ENDPOINT_URL: http://minio:9000
      SMARTLIB_S3_ACCESS_KEY: ${SMARTLIB_MINIO_ROOT_USER:?Set SMARTLIB_MINIO_ROOT_USER}
      SMARTLIB_S3_SECRET_KEY: ${SMARTLIB_MINIO_ROOT_PASSWORD:?Set SMARTLIB_MINIO_ROOT_PASSWORD}
      SMARTLIB_S3_REGION: ${SMARTLIB_S3_REGION:-us-east-1}
      SMARTLIB_S3_BUCKET: ${SMARTLIB_S3_BUCKET:-smartlib-publications}
      SMARTLIB_BATCH_FULLTEXT_MAX_BYTES: ${SMARTLIB_BATCH_FULLTEXT_MAX_BYTES:-367001600}
    command:
      - python
      - /app/scripts/stage_archive_fulltexts.py
      - --matches
      - /smartlib-archive-results/matches.json
      - --reported-root
      - /Volumes/张蕾历年工作备份
      - --archive-root
      - /smartlib-archive
      - --report
      - /smartlib-archive-results/object-storage-staging-report.json
      - --apply
    volumes:
      - ../../apps/platform-api/scripts:/app/scripts:ro
      - ../../apps/platform-api/src:/app/src:ro
      - ../../data/archive-fulltext-discovery:/smartlib-archive-results
      - ${SMARTLIB_ARCHIVE_FULLTEXT_SOURCE:-/Volumes/张蕾历年工作备份}:/smartlib-archive:ro
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  controlled-staged-fulltext-promotion:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["controlled-import"]
    environment:
      SMARTLIB_DATABASE_URL: postgresql://smartlib_api:${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
    command:
      - python
      - /app/scripts/promote_staged_fulltexts.py
      - --report
      - /smartlib-fulltext-reports/staged-promotion-report.json
      - --apply
    volumes:
      - ../../apps/platform-api/scripts:/app/scripts:ro
      - ../../apps/platform-api/src:/app/src:ro
      - ../../data/fulltext-ingestion:/smartlib-fulltext-reports
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - smartlib-internal

  platform-api:
    build:
      context: ../../apps/platform-api
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${SMARTLIB_PYTHON_IMAGE:-public.ecr.aws/docker/library/python:3.14.7-slim-bookworm}
        SMARTLIB_PIP_INDEX_URL: ${SMARTLIB_PIP_INDEX_URL:-https://pypi.org/simple}
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    environment:
      SMARTLIB_DATABASE_URL: postgresql://smartlib_api:${SMARTLIB_DB_API_PASSWORD:?Set SMARTLIB_DB_API_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_DEV_ACTOR_ID: ${SMARTLIB_DEV_ACTOR_ID:-00000000-0000-4000-8000-000000000001}
      SMARTLIB_ENVIRONMENT: ${SMARTLIB_ENVIRONMENT:-development}
      SMARTLIB_SEARCH_BACKEND: ${SMARTLIB_SEARCH_BACKEND:-postgres}
      SMARTLIB_OPENSEARCH_URL: ${SMARTLIB_OPENSEARCH_URL:-http://opensearch:9200}
      SMARTLIB_OPENSEARCH_INDEX_ALIAS: ${SMARTLIB_OPENSEARCH_INDEX_ALIAS:-smartlib-knowledge-read}
      SMARTLIB_GRAPH_BACKEND: ${SMARTLIB_GRAPH_BACKEND:-postgres}
      SMARTLIB_HUGEGRAPH_URL: ${SMARTLIB_HUGEGRAPH_URL:-http://hugegraph:8080}
      SMARTLIB_HUGEGRAPH_USER: ${SMARTLIB_HUGEGRAPH_USER:-admin}
      SMARTLIB_HUGEGRAPH_PASSWORD: ${SMARTLIB_HUGEGRAPH_PASSWORD:?Set SMARTLIB_HUGEGRAPH_PASSWORD}
      SMARTLIB_HUGEGRAPH_GRAPH: ${SMARTLIB_HUGEGRAPH_GRAPH:-hugegraph}
      SMARTLIB_S3_ENDPOINT_URL: ${SMARTLIB_S3_ENDPOINT_URL:-http://minio:9000}
      SMARTLIB_S3_PUBLIC_ENDPOINT_URL: ${SMARTLIB_S3_PUBLIC_ENDPOINT_URL:-http://localhost:19000}
      SMARTLIB_S3_REGION: ${SMARTLIB_S3_REGION:-us-east-1}
      SMARTLIB_S3_BUCKET: ${SMARTLIB_S3_BUCKET:-smartlib-publications}
      SMARTLIB_S3_ACCESS_KEY: ${SMARTLIB_MINIO_ROOT_USER:?Set SMARTLIB_MINIO_ROOT_USER}
      SMARTLIB_S3_SECRET_KEY: ${SMARTLIB_MINIO_ROOT_PASSWORD:?Set SMARTLIB_MINIO_ROOT_PASSWORD}
      SMARTLIB_FULLTEXT_MAX_BYTES: ${SMARTLIB_FULLTEXT_MAX_BYTES:-104857600}
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${SMARTLIB_API_PORT:-18081}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 8
    networks:
      - smartlib-internal

  search-projection-worker:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    environment:
      SMARTLIB_PROJECTION_DATABASE_URL: postgresql://smartlib_projection_worker:${SMARTLIB_DB_PROJECTION_PASSWORD:?Set SMARTLIB_DB_PROJECTION_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_SEARCH_PROJECTION_TARGET: ${SMARTLIB_SEARCH_PROJECTION_TARGET:-postgres}
      SMARTLIB_OPENSEARCH_URL: ${SMARTLIB_OPENSEARCH_URL:-http://opensearch:9200}
      SMARTLIB_OPENSEARCH_WRITE_ALIAS: ${SMARTLIB_OPENSEARCH_WRITE_ALIAS:-smartlib-knowledge-write}
    command: ["python", "-m", "smartlib_platform.projection.worker"]
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - smartlib-internal

  opensearch:
    image: ${SMARTLIB_OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0}
    profiles: ["search-poc"]
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - smartlib-opensearch:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    networks:
      - smartlib-internal

  opensearch-init:
    image: ${SMARTLIB_OPENSEARCH_IMAGE:-opensearchproject/opensearch:3.8.0}
    profiles: ["search-poc"]
    environment:
      SMARTLIB_OPENSEARCH_URL: http://opensearch:9200
    command: ["sh", "/smartlib-opensearch/bootstrap.sh"]
    volumes:
      - ../opensearch:/smartlib-opensearch:ro
    depends_on:
      opensearch:
        condition: service_healthy
    restart: "no"
    networks:
      - smartlib-internal

  hugegraph:
    image: ${SMARTLIB_HUGEGRAPH_IMAGE:-hugegraph/hugegraph:1.7.0}
    profiles: ["graph-poc"]
    environment:
      PASSWORD: ${SMARTLIB_HUGEGRAPH_PASSWORD:?Set SMARTLIB_HUGEGRAPH_PASSWORD}
    volumes:
      - smartlib-hugegraph:/hugegraph-server/rocksdb-data
    ports:
      - "${SMARTLIB_HUGEGRAPH_PORT:-18082}:8080"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/versions >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30
    networks:
      - smartlib-internal

  hugegraph-init:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["graph-poc"]
    environment:
      SMARTLIB_HUGEGRAPH_URL: ${SMARTLIB_HUGEGRAPH_URL:-http://hugegraph:8080}
      SMARTLIB_HUGEGRAPH_USER: ${SMARTLIB_HUGEGRAPH_USER:-admin}
      SMARTLIB_HUGEGRAPH_PASSWORD: ${SMARTLIB_HUGEGRAPH_PASSWORD:?Set SMARTLIB_HUGEGRAPH_PASSWORD}
      SMARTLIB_HUGEGRAPH_GRAPH: ${SMARTLIB_HUGEGRAPH_GRAPH:-hugegraph}
    command: ["python", "/smartlib-hugegraph/bootstrap.py"]
    volumes:
      - ../hugegraph:/smartlib-hugegraph:ro
    depends_on:
      hugegraph:
        condition: service_healthy
    restart: "no"
    networks:
      - smartlib-internal

  hubble:
    image: ${SMARTLIB_HUBBLE_IMAGE:-hugegraph/hubble:1.7.0}
    profiles: ["graph-poc"]
    depends_on:
      hugegraph:
        condition: service_healthy
    ports:
      - "${SMARTLIB_HUBBLE_PORT:-18088}:8088"
    restart: unless-stopped
    networks:
      - smartlib-internal

  graph-projection-worker:
    image: smartlib/platform-api:${SMARTLIB_IMAGE_TAG:-local}
    profiles: ["graph-poc"]
    environment:
      SMARTLIB_PROJECTION_DATABASE_URL: postgresql://smartlib_projection_worker:${SMARTLIB_DB_PROJECTION_PASSWORD:?Set SMARTLIB_DB_PROJECTION_PASSWORD}@postgres:5432/${SMARTLIB_DB_NAME:-smartlib}
      SMARTLIB_HUGEGRAPH_URL: ${SMARTLIB_HUGEGRAPH_URL:-http://hugegraph:8080}
      SMARTLIB_HUGEGRAPH_USER: ${SMARTLIB_HUGEGRAPH_USER:-admin}
      SMARTLIB_HUGEGRAPH_PASSWORD: ${SMARTLIB_HUGEGRAPH_PASSWORD:?Set SMARTLIB_HUGEGRAPH_PASSWORD}
      SMARTLIB_HUGEGRAPH_GRAPH: ${SMARTLIB_HUGEGRAPH_GRAPH:-hugegraph}
    command: ["python", "-m", "smartlib_platform.projection.graph_worker"]
    depends_on:
      provision-api-role:
        condition: service_completed_successfully
      hugegraph-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - smartlib-internal

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${SMARTLIB_NODE_IMAGE:-public.ecr.aws/docker/library/node:22-alpine}
        NGINX_IMAGE: ${SMARTLIB_NGINX_IMAGE:-public.ecr.aws/docker/library/nginx:1.28-alpine}
        VITE_SMARTLIB_DEMO_MODE: ${SMARTLIB_WEB_DEMO_MODE:-true}
    image: smartlib/web:${SMARTLIB_IMAGE_TAG:-local}
    depends_on:
      platform-api:
        condition: service_healthy
    ports:
      - "${SMARTLIB_WEB_PORT:-18080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6
    networks:
      - smartlib-internal

networks:
  smartlib-internal:
    name: smartlib-internal

volumes:
  smartlib-postgres:
    name: smartlib-postgres
  smartlib-opensearch:
    name: smartlib-opensearch
  smartlib-hugegraph:
    name: smartlib-hugegraph
  smartlib-minio:
    name: smartlib-minio
