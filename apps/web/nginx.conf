server {
    listen 8080;
    server_name _;
    # Match the API's 100 MiB full-text limit, allowing multipart overhead.
    client_max_body_size 110m;

    # Docker service addresses can change when a container is recreated.
    # Resolve the API service continuously instead of caching its startup IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        set $platform_api_upstream platform-api:8080;
        proxy_pass http://$platform_api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
        # Temporary intranet demonstration mode.  Until the login gateway is
        # connected, every request uses the seeded demonstration administrator.
        # Always replace caller-supplied identities at the edge.
        proxy_set_header X-SmartLib-Actor-Id "00000000-0000-4000-8000-000000000001";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
